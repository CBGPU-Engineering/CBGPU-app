name: Signed Android release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    environment: android-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check signing availability
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASS" && -n "$KEY_PASS" && -n "$KEY_ALIAS" && -n "$EXPECTED_CERT_SHA256" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signed release skipped: configure Android signing secrets. No debug-signed APK will be published.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native Android build dependencies
        if: steps.signing.outputs.ready == 'true'
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Require successful native emulator CI for this exact commit
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 10 --json conclusion,headSha --jq 'length')" -gt 0
      - name: Build signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          cd .
          test "$(sed -n 's/^versionName=//p' android/version.properties)" = "${GITHUB_REF_NAME#v}"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cbgpu-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/cbgpu-release.jks" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
          cargo test --manifest-path native-core/Cargo.toml --locked
          ./android/gradlew -p android assembleRelease
          signer_bin=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer_bin"
          "$signer_bin" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -Fi "$EXPECTED_CERT_SHA256"
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/cbgpu.apk
          cd .
          node scripts/checksums.mts release-artifacts
      - name: Publish signed Android assets
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "CBGPU Android ${GITHUB_REF_NAME#v}" --notes 'Signed Android release. See CHANGELOG.md and README.md for verification scope.'
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
      - name: Clean signing material
        if: always()
        run: node scripts/cleanup-signing.mts
