name: Native Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path native-core/Cargo.toml -- --check
      - run: cargo test --manifest-path native-core/Cargo.toml --locked
      - run: cargo clippy --manifest-path native-core/Cargo.toml --locked -- -D warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run check:publication
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Install native Android dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: ./android/gradlew -p android assembleDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Enable KVM on the ephemeral CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test JNI and WebView main-frame/origin boundary on emulator
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./android/gradlew -p android connectedDebugAndroidTest
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-android-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
